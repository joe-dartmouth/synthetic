[project]
name = "bko"
version = "0.0.0"
description = "Bayesian Knowledge-driven Ontologies for synthetic clinical data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

# Runtime dependencies are declared and locked here but installed on demand: an extra joins
# `make setup` when something in `src/`, `tests/` or `tools/` imports it (ADR `tooling/uv-ruff-ty`).
# Floors are the registry's major.minor at the time each was declared; `uv.lock` holds the exact
# versions.
[project.optional-dependencies]
data = ["numpy>=2.5", "pandas>=2.3"]
ontology = ["owlready2>=0.51", "pronto>=2.7"]
llm = ["anthropic>=1.13"]
# CTGAN and TVAE come from SDV; SMOTE and ADASYN from imbalanced-learn.
synth = ["sdv>=1.38", "imbalanced-learn>=0.14"]
eval = ["scikit-learn>=1.9", "sdmetrics>=0.32"]
app = ["streamlit>=1.65"]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    # Declared rather than taken through pytest-cov: `tests/test_repo_gate.py` imports it.
    "coverage>=7.16",
    "pytest-xdist>=3.8",
    # Pinned exactly: a floating linter or checker changes the verdict on an unchanged tree.
    # `tests/test_repo_gate.py` asserts the installed versions match.
    "ruff==0.17.0",
    "ty==0.0.87",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bko"]
# Ship the PEP 561 marker so consumers get inline type information.
force-include = { "src/bko/py.typed" = "bko/py.typed" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--strict-markers` turns a mistyped marker into an error. `-ra` prints every skip, because a skip
# nobody reads is indistinguishable from a pass. Paid tests need `--live` (`tests/conftest.py`).
addopts = "-m 'not live' --strict-markers -ra"
# pytest's own removal warnings fail the suite now rather than at the next major release.
filterwarnings = ["error::pytest.PytestRemovedIn10Warning"]
# A parametrization over an empty set is an error, not a skip that reads as a pass.
empty_parameter_set_mark = "fail_at_collect"
markers = [
    "live: Calls a paid API; needs `--live`, not just a marker selector",
    "integration: Touches the network or the filesystem beyond tmp_path",
]

[tool.coverage.run]
# `tools` is measured as well as the library: the checkers are part of the gate, and a gate
# with untested branches is what this floor exists to surface.
source = ["src/bko", "tools"]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
# The checkers run as `python -m`; their entry guards are exercised through `main()` instead.
exclude_also = ['if __name__ == "__main__":']
