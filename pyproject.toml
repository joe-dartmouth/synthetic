[project]
name = "bko"
version = "0.0.0"
description = "Bayesian Knowledge-driven Ontologies for synthetic clinical data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

# Runtime dependencies are locked extras; `make setup` installs the ones something imports (ADR
# `tooling/uv-ruff-ty` holds the rule). Runtime floors are the registry's major.minor when each was
# declared; dev floors are the majors the gate runs on. `uv.lock` holds the exact versions.
[project.optional-dependencies]
data = ["numpy>=2.5", "pandas>=2.3"]
ontology = ["owlready2>=0.51", "pronto>=2.7"]
llm = ["anthropic>=1.13"]
# CTGAN and TVAE come from SDV; SMOTE and ADASYN from imbalanced-learn.
synth = ["sdv>=1.38", "imbalanced-learn>=0.14"]
eval = ["scikit-learn>=1.9", "sdmetrics>=0.32"]
app = ["streamlit>=1.65"]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    # Declared rather than taken through pytest-cov: `tests/test_repo_gate.py` imports it.
    "coverage>=7.16",
    "pytest-xdist>=3.8",
    # Pinned exactly: a floating linter, checker or the stubs the checker reads change the verdict
    # on an unchanged tree. `tests/test_repo_gate.py` asserts the installed versions match, and
    # that the pandas-stubs release describes the installed pandas.
    "ruff==0.17.0",
    "ty==0.0.87",
    "pandas-stubs==2.3.3.260113",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `py.typed` ships because it sits inside the package; the stage READMEs are repository docs.
packages = ["src/bko"]
exclude = ["src/bko/**/README.md"]

[tool.uv]
# Pin the build backends uv resolves outside the lock: hatchling builds `bko` itself, and the
# setuptools/wheel/Cython trio builds owlready2, whose release ships only an sdist.
build-constraint-dependencies = [
    "hatchling==1.32.4",
    "setuptools==84.0.0",
    "wheel==0.48.0",
    "cython==3.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--strict-markers` turns a mistyped marker into an error. `-ra` prints every skip, because a skip
# nobody reads is indistinguishable from a pass. Paid tests are skipped unless `--live` is passed
# (`tests/conftest.py`); no `-m` expression selects them.
addopts = "--strict-markers -ra"
# pytest's own removal warnings fail the suite now rather than at the next major release.
filterwarnings = ["error::pytest.PytestRemovedIn10Warning"]
# A parametrization over an empty set is an error, not a skip that reads as a pass.
empty_parameter_set_mark = "fail_at_collect"
markers = [
    "live: Calls a paid API; needs `--live`, not just a marker selector",
    "integration: Touches the network or the filesystem beyond tmp_path",
]

[tool.coverage.run]
# `tools` is measured as well as the library: the checkers are part of the gate, and a gate
# with untested branches is what this floor exists to surface.
source = ["src/bko", "tools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
# The checkers run as `python -m`; their entry guards are exercised through `main()` instead.
exclude_also = ['if __name__ == "__main__":']
